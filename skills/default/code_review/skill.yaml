name: code_review
version: 0.1.0
description: Review local code for correctness and safety issues.
triggers:
  - code review
  - review this code
  - review code
required_tools:
  - read_file
  - search_files
permissions:
  filesystem_read: true
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 0
