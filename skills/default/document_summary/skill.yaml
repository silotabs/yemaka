name: document_summary
version: 0.1.0
description: Summarize local documents using retrieved or read context.
triggers:
  - summarize
  - summary
  - document
required_tools:
  - read_file
  - rag_search
permissions:
  filesystem_read: true
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1600
  max_examples: 0
