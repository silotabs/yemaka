name: email_draft_review
version: 0.1.0
description: Draft or improve a reviewable email from pasted notes, local memory, or ingested local context.
triggers:
  - email draft review
  - draft an email
  - write a reply draft
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
