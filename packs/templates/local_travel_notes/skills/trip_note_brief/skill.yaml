name: trip_note_brief
version: 0.1.0
description: Summarize local trip notes into itinerary items, constraints, missing details, assumptions, and review questions.
triggers:
  - trip note brief
  - summarize trip notes
  - itinerary note review
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
