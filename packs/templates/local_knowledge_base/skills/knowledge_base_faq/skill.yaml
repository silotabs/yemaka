name: knowledge_base_faq
version: 0.1.0
description: Create source-backed FAQ entries, gaps, and review questions from pasted notes or ingested local documents.
triggers:
  - local knowledge base faq
  - knowledge base faq
  - faq from local docs
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
