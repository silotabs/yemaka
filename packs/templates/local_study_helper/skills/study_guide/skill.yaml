name: study_guide
version: 0.1.0
description: Build a compact study guide from local notes, ingested documents, and local memory.
triggers:
  - make a study guide
  - explain my notes
  - summarize for studying
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
