name: support_ticket_summary
version: 0.1.0
description: Summarize a pasted or locally ingested support ticket into issue, facts, missing details, and reviewable next-step notes.
triggers:
  - support ticket summary
  - summarize this ticket
  - customer support notes
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
