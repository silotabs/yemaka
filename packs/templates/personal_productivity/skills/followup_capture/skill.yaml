name: followup_capture
version: 0.1.0
description: Extract follow-ups from user-provided notes and save only confirmed local memory.
triggers:
  - capture follow ups
  - save follow-up tasks
  - remember action items
required_tools:
  - memory_search
  - memory_write
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1700
  max_examples: 1
