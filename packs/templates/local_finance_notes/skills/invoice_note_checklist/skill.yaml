name: invoice_note_checklist
version: 0.1.0
description: Organize invoice notes into reviewable status, missing details, follow-up questions, and assumptions.
triggers:
  - invoice note checklist
  - review invoice notes
  - payment status questions
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
