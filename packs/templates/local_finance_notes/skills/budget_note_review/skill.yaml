name: budget_note_review
version: 0.1.0
description: Summarize pasted or local budget notes into expense categories, questions, assumptions, and review notes.
triggers:
  - budget note review
  - review budget notes
  - expense category summary
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
