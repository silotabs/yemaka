name: account_hygiene_checklist
version: 0.1.0
description: Organize local account-safety notes into a manual checklist for passwords, recovery options, two-factor setup, and privacy review.
triggers:
  - account hygiene checklist
  - password manager checklist
  - two factor checklist
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
