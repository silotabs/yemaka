name: client_call_brief
version: 0.1.0
description: Produce a compact client call brief from pasted sales notes, local memory, or ingested local client context.
triggers:
  - client call brief
  - prepare client call
  - summarize account notes
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
