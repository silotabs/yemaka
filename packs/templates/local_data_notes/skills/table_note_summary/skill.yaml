name: table_note_summary
version: 0.1.0
description: Summarize pasted or local tabular/list notes with visible themes, counts, repeated values, and follow-up questions.
triggers:
  - summarize table notes
  - review list notes
  - group pasted list
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
