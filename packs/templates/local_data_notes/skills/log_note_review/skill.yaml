name: log_note_review
version: 0.1.0
description: Review pasted or local log-style notes and records for repeated items, gaps, unusual entries, and follow-up questions.
triggers:
  - review log notes
  - inspect record notes
  - summarize note patterns
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
