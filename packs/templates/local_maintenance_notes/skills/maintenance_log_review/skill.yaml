name: maintenance_log_review
version: 0.1.0
description: Review pasted or local maintenance logs into issue summaries, timelines, unresolved items, questions, and professional-caution notes.
triggers:
  - maintenance log review
  - review maintenance notes
  - home repair log summary
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
