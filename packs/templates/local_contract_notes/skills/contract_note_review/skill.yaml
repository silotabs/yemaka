name: contract_note_review
version: 0.1.0
description: Summarize local contract notes into parties, dates, obligations, unclear clauses, and questions for review.
triggers:
  - contract note review
  - review contract notes
  - agreement note review
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
