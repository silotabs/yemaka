name: code_note_review
version: 0.1.0
description: Organize pasted or local developer notes into API notes, assumptions, gaps, and review questions.
triggers:
  - code note review
  - coding note review
  - api note review
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
