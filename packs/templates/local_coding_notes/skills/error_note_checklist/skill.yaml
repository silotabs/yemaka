name: error_note_checklist
version: 0.1.0
description: Turn pasted or local error notes into a manual troubleshooting checklist, assumptions, gaps, and questions.
triggers:
  - error note checklist
  - troubleshooting notes checklist
  - review error notes
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
