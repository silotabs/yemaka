name: tone_structure_review
version: 0.1.0
description: Review a pasted or local draft for tone, audience fit, section order, and structure.
triggers:
  - tone structure review
  - check draft tone
  - organize this draft
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
