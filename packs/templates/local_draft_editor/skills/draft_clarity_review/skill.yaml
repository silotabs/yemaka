name: draft_clarity_review
version: 0.1.0
description: Review a pasted or local draft for clarity, concision, flow, and confusing wording.
triggers:
  - draft clarity review
  - review this draft
  - make this draft clearer
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
