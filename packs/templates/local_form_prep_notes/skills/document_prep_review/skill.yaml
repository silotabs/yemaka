name: document_prep_review
version: 0.1.0
description: Review pasted or local document-prep notes into required documents, missing items, unclear entries, and questions.
triggers:
  - document prep review
  - review document prep notes
  - application document checklist
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
