name: health_question_review
version: 0.1.0
description: Review local health notes and prepare clear clinician questions, context, and missing-detail prompts.
triggers:
  - review symptom notes
  - prepare clinician questions
  - medication note checklist
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1900
  max_examples: 1
