name: interview_note_prep
version: 0.1.0
description: Organize local interview notes into themes, examples to prepare, likely questions, and follow-up questions.
triggers:
  - interview note prep
  - review interview notes
  - prepare role questions
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
