name: source_brief
version: 0.1.0
description: Build a compact research brief from local documents and memory with source labels.
triggers:
  - source backed brief
  - research from local docs
  - summarize local evidence
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
