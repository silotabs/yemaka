name: risk_blocker_review
version: 0.1.0
description: Review local project context for risks, blockers, unresolved decisions, owners, dates, and follow-up questions.
triggers:
  - risk blocker review
  - review project blockers
  - list unresolved project risks
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
