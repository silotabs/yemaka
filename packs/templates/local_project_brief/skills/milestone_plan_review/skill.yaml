name: milestone_plan_review
version: 0.1.0
description: Draft reviewable milestones, dependencies, assumptions, and next-step questions from local project notes without assigning or scheduling work.
triggers:
  - milestone plan review
  - draft milestone plan
  - project milestone review
required_tools:
  - rag_search
  - memory_search
permissions:
  filesystem_read: false
  filesystem_write: ""
  shell: ""
  network: false
context_budget:
  max_instruction_chars: 1800
  max_examples: 1
